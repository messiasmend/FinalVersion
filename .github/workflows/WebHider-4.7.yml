name: WebHider 4.7 Build

on:
  workflow_dispatch:
  push:
    branches:
      - build-4.7-metadata

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WebHider 4.7 source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build WebHider 4.7
        working-directory: WebHider-4.7-Source
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Verify build output
        working-directory: WebHider-4.7-Source
        run: |
          set -euo pipefail
          find .theos -maxdepth 4 -type f \( -name '*.deb' -o -name '*.dylib' \) -print

      - name: Collect dylib
        working-directory: WebHider-4.7-Source
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -name '*.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/WebHider-4.7.dylib
          test -s artifacts/WebHider-4.7.dylib

      - name: Package WebHider 4.7 source
        run: |
          set -euo pipefail
          zip -r WebHider-4.7-Source.zip WebHider-4.7-Source -x 'WebHider-4.7-Source/.theos/*'
          test -s WebHider-4.7-Source.zip

      - name: Upload WebHider 4.7 dylib
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-4.7
          path: WebHider-4.7-Source/artifacts/WebHider-4.7.dylib
          if-no-files-found: error

      - name: Upload WebHider 4.7 source
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-4.7-Source
          path: WebHider-4.7-Source.zip
          if-no-files-found: error
