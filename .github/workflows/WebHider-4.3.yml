name: WebHider 4.3 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Trigger WebHider 4.3 build'
    runs-on: macos-14
    steps:
      - name: Checkout WebHider 4.3
        uses: actions/checkout@v4

      - name: Prepare WebHider 4.3 from approved 4.2
        run: |
          set -euo pipefail
          rm -rf WebHider-4.3
          cp -R WebHider-4.2 WebHider-4.3
          python3 - <<'PY'
          from pathlib import Path
          p = Path('WebHider-4.3/Sources/PHV233FinalUI.m')
          s = p.read_text()

          # 4.3 GUI-only adjustment: 12px above and below the three action cards.
          s = s.replace('[copyC.topAnchor constraintEqualToAnchor:seg.bottomAnchor constant:25]',
                        '[copyC.topAnchor constraintEqualToAnchor:seg.bottomAnchor constant:12]')
          s = s.replace('[close.topAnchor constraintEqualToAnchor:copyC.bottomAnchor constant:25]',
                        '[close.topAnchor constraintEqualToAnchor:copyC.bottomAnchor constant:12]')
          s = s.replace('[save.topAnchor constraintEqualToAnchor:copyC.bottomAnchor constant:25]',
                        '[save.topAnchor constraintEqualToAnchor:copyC.bottomAnchor constant:12]')

          # 4.3 GUI-only adjustment: each action card is exactly 80px high.
          s = s.replace('[copyC.heightAnchor constraintEqualToConstant:86.4]',
                        '[copyC.heightAnchor constraintEqualToConstant:80]')

          # Center the icon + title group vertically inside the 80px cards.
          # Group height = 30 + 4 + 20 = 54px; remaining space = 26px => 13px each side.
          s = s.replace('[copyIcon.topAnchor constraintEqualToAnchor:copyC.topAnchor constant:10]',
                        '[copyIcon.topAnchor constraintEqualToAnchor:copyC.topAnchor constant:13]')
          s = s.replace('[hiddenIcon.topAnchor constraintEqualToAnchor:hiddenC.topAnchor constant:10]',
                        '[hiddenIcon.topAnchor constraintEqualToAnchor:hiddenC.topAnchor constant:13]')
          s = s.replace('[hideIcon.topAnchor constraintEqualToAnchor:hideC.topAnchor constant:10]',
                        '[hideIcon.topAnchor constraintEqualToAnchor:hideC.topAnchor constant:13]')

          # Reduce only the panel height required by the three spacing/card-height changes.
          # Delta: -13px top gap, -6.4px card height, -13px bottom gap = -32.4px.
          s = s.replace('[panel.widthAnchor constraintEqualToConstant:350],[panel.heightAnchor constraintEqualToConstant:548.4]',
                        '[panel.widthAnchor constraintEqualToConstant:350],[panel.heightAnchor constraintEqualToConstant:516]')

          p.write_text(s)
          PY

          # Verify the requested GUI geometry before building.
          grep -q 'copyC.topAnchor constraintEqualToAnchor:seg.bottomAnchor constant:12' WebHider-4.3/Sources/PHV233FinalUI.m
          grep -q 'copyC.heightAnchor constraintEqualToConstant:80' WebHider-4.3/Sources/PHV233FinalUI.m
          grep -q 'copyIcon.topAnchor constraintEqualToAnchor:copyC.topAnchor constant:13' WebHider-4.3/Sources/PHV233FinalUI.m
          grep -q 'hiddenIcon.topAnchor constraintEqualToAnchor:hiddenC.topAnchor constant:13' WebHider-4.3/Sources/PHV233FinalUI.m
          grep -q 'hideIcon.topAnchor constraintEqualToAnchor:hideC.topAnchor constant:13' WebHider-4.3/Sources/PHV233FinalUI.m
          grep -q 'close.topAnchor constraintEqualToAnchor:copyC.bottomAnchor constant:12' WebHider-4.3/Sources/PHV233FinalUI.m
          grep -q 'save.topAnchor constraintEqualToAnchor:copyC.bottomAnchor constant:12' WebHider-4.3/Sources/PHV233FinalUI.m
          grep -q 'panel.heightAnchor constraintEqualToConstant:516' WebHider-4.3/Sources/PHV233FinalUI.m

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WebHider-4.3
          git commit -m "Prepare WebHider 4.3 GUI spacing" || true
          git push

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build WebHider 4.3
        working-directory: WebHider-4.3
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Verify package output
        working-directory: WebHider-4.3
        run: |
          set -euo pipefail
          find .theos -maxdepth 3 -type f \( -name '*.deb' -o -name '*.dylib' \) -print

      - name: Collect dylib
        working-directory: WebHider-4.3
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -name '*.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/WebHider-4.3.dylib
          test -s artifacts/WebHider-4.3.dylib

      - name: Upload WebHider 4.3
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-4.3
          path: WebHider-4.3/artifacts/WebHider-4.3.dylib
          if-no-files-found: error
