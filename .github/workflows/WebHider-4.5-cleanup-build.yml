name: WebHider 4.5 Cleanup Build Test

on:
  push:
    branches:
      - webhider-4.5-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WebHider 4.5 from 4.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf WebHider-4.5
          cp -R WebHider-4.4 WebHider-4.5
          rm -f WebHider-4.5/Sources/PHVisualStyle23.m
          sed -i '' '/Sources\/PHVisualStyle23\.m/d' WebHider-4.5/Makefile

      - name: Verify only cleanup change
        shell: bash
        run: |
          set -euo pipefail
          test ! -f WebHider-4.5/Sources/PHVisualStyle23.m
          if grep -q 'Sources/PHVisualStyle23.m' WebHider-4.5/Makefile; then exit 1; fi
          test -f WebHider-4.5/Sources/PHV233FinalUI.m
          grep -q 'PHV44Haptics' WebHider-4.5/Sources/PHV233FinalUI.m

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build WebHider 4.5 cleanup
        working-directory: WebHider-4.5
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Verify package output
        working-directory: WebHider-4.5
        shell: bash
        run: |
          set -euo pipefail
          find .theos -maxdepth 3 -type f \( -name '*.deb' -o -name '*.dylib' \) -print

      - name: Collect dylib
        working-directory: WebHider-4.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -name '*.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/WebHider-4.5-cleanup.dylib
          test -s artifacts/WebHider-4.5-cleanup.dylib

      - name: Upload cleanup artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-4.5-cleanup
          path: WebHider-4.5/artifacts/WebHider-4.5-cleanup.dylib
          if-no-files-found: error
