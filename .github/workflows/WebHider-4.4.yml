name: WebHider 4.4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WebHider 4.4 from approved 4.3
        run: |
          set -euo pipefail
          rm -rf WebHider-4.4
          cp -R WebHider-4.3 WebHider-4.4
          python3 - <<'PY'
          from pathlib import Path
          p = Path('WebHider-4.4/Sources/PHV233FinalUI.m')
          s = p.read_text()
          marker = '@interface PHInspectorViewController : UIViewController\n'
          if 'PHV44Haptics' in s:
              raise SystemExit('4.4 haptics already present')
          s = s.replace(marker, marker, 1)
          s = s.replace('[copy addTarget:vc action:@selector(copyTapped) forControlEvents:UIControlEventTouchUpInside];[copyC addSubview:copy];', '[copy addTarget:vc action:@selector(copyTapped) forControlEvents:UIControlEventTouchUpInside];[copy addTarget:vc action:@selector(phv44_hapticButtonTapped:) forControlEvents:UIControlEventTouchUpInside];[copyC addSubview:copy];')
          s = s.replace('[hidden addTarget:vc action:@selector(hiddenTapped) forControlEvents:UIControlEventTouchUpInside];[hiddenC addSubview:hidden];', '[hidden addTarget:vc action:@selector(hiddenTapped) forControlEvents:UIControlEventTouchUpInside];[hidden addTarget:vc action:@selector(phv44_hapticButtonTapped:) forControlEvents:UIControlEventTouchUpInside];[hiddenC addSubview:hidden];')
          s = s.replace('[hide addTarget:vc action:@selector(hideTapped) forControlEvents:UIControlEventTouchUpInside];[hideC addSubview:hide];', '[hide addTarget:vc action:@selector(hideTapped) forControlEvents:UIControlEventTouchUpInside];[hide addTarget:vc action:@selector(phv44_hapticButtonTapped:) forControlEvents:UIControlEventTouchUpInside];[hideC addSubview:hide];')
          s += '''\n\n@interface PHInspectorViewController (PHV44Haptics)\n- (void)phv44_hapticButtonTapped:(UIButton *)sender;\n@end\n\n@implementation PHInspectorViewController (PHV44Haptics)\n- (void)phv44_hapticButtonTapped:(UIButton *)sender {\n    if (@available(iOS 10.0, *)) {\n        UIImpactFeedbackGenerator *feedback = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleLight];\n        [feedback prepare];\n        [feedback impactOccurred];\n    }\n}\n@end\n'''
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WebHider-4.4/Sources/PHV233FinalUI.m
          git diff --cached --quiet || git commit -m "Implement WebHider 4.4 haptic feedback"
          git push

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build WebHider 4.4
        working-directory: WebHider-4.4
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Verify package output
        working-directory: WebHider-4.4
        run: |
          set -euo pipefail
          find .theos -maxdepth 3 -type f \( -name '*.deb' -o -name '*.dylib' \) -print

      - name: Collect dylib
        working-directory: WebHider-4.4
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -name '*.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/WebHider-4.4.dylib
          test -s artifacts/WebHider-4.4.dylib

      - name: Upload WebHider 4.4
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-4.4
          path: WebHider-4.4/artifacts/WebHider-4.4.dylib
          if-no-files-found: error
